<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cotización Oficial - Maratón Moroleón 2027</title>
    <!-- Bibliotecas para exportar PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root { --primary: #0f172a; --success: #16a34a; --accent: #0284c7; }
        body { font-family: 'Segoe UI', sans-serif; background: #f1f5f9; padding: 20px; color: var(--primary); }
        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .header { text-align: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 20px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th { background: #0f172a; color: white; padding: 12px; }
        td { padding: 10px; border-bottom: 1px solid #e2e8f0; }
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
        .btn { padding: 10px 20px; border-radius: 6px; cursor: pointer; border: none; font-weight: bold; }
        .btn-pdf { background: var(--primary); color: white; }
        .btn-wp { background: #25d366; color: white; }
        .input-qty { width: 60px; padding: 5px; text-align: center; }
    </style>
</head>
<body>

<div class="container" id="cotizacionArea">
    <div class="header">
        <h1>Cotización de Servicios</h1>
        <p>Maratón Internacional Moroleón 2027</p>
    </div>

    <div id="adminPanel" style="display:none; background:#fff7ed; padding:15px; border-radius:8px; margin-bottom:20px;">
        <label>Costos Adicionales (Prorrateo): $</label>
        <input type="number" id="extraGastos" value="0" oninput="calcularPresupuesto()">
    </div>

    <table id="tablaServicios">
        <thead>
            <tr>
                <th>Servicio</th>
                <th>Cant.</th>
                <th>Precio Unit.</th>
                <th>Total</th>
                <th>Activar</th>
            </tr>
        </thead>
        <tbody id="tbodyServicios"></tbody>
    </table>

    <div style="text-align: right; font-size: 1.5rem;">
        <strong>Total: $<span id="lblTotalFinal">0.00</span></strong>
    </div>

    <div class="controls">
        <button class="btn btn-pdf" onclick="descargarPDF()">📥 Descargar PDF</button>
        <button class="btn btn-wp" onclick="enviarWhatsApp()">💬 Enviar por WhatsApp</button>
        <button class="btn" onclick="toggleAdmin()">⚙️ Admin</button>
    </div>
</div>

<script>
    // Tu lógica funcional original se mantiene intacta, agregamos lo nuevo abajo
    let servicios = JSON.parse(localStorage.getItem('metaX_presupuesto_servicios')) || serviciosIniciales;
    let isAdmin = false;

    function renderTabla() {
        const tbody = document.getElementById('tbodyServicios');
        tbody.innerHTML = '';
        servicios.forEach((s, i) => {
            tbody.innerHTML += `
                <tr>
                    <td><strong>${s.nombre}</strong><br><small>${s.detalle}</small></td>
                    <td><input type="number" class="input-qty" value="${s.cant || 1}" oninput="actualizarCant(${i}, this.value)"></td>
                    <td>${isAdmin ? `<input type="number" value="${s.precio}" oninput="actualizarPrecio(${i}, this.value)">` : '$'+s.precio}</td>
                    <td>$<span class="row-total">${(s.precio * (s.cant || 1)).toFixed(2)}</span></td>
                    <td><input type="checkbox" class="chk" ${s.activo ? 'checked' : ''} onchange="actualizarActivo(${i}, this.checked)"></td>
                </tr>
            `;
        });
    }

    function actualizarCant(i, val) { servicios[i].cant = parseInt(val); renderTabla(); calcularPresupuesto(); }
    function actualizarActivo(i, val) { servicios[i].activo = val; calcularPresupuesto(); }

    function calcularPresupuesto() {
        let subtotal = 0;
        servicios.forEach(s => { if(s.activo) subtotal += (s.precio * (s.cant || 1)); });
        const extra = parseFloat(document.getElementById('extraGastos').value) || 0;
        document.getElementById('lblTotalFinal').innerText = (subtotal + extra).toLocaleString();
    }

    function descargarPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.text("Presupuesto Maraton Moroleon 2027", 10, 10);
        doc.autoTable({ html: '#tablaServicios' });
        doc.save("Cotizacion_Maraton.pdf");
    }

    function enviarWhatsApp() {
        let msg = "Hola, solicito el siguiente presupuesto: ";
        servicios.forEach(s => { if(s.activo) msg += `${s.nombre} ($${s.precio}), `; });
        window.open(`https://wa.me/521XXXXXXXXXX?text=${encodeURIComponent(msg)}`);
    }

    function toggleAdmin() { 
        isAdmin = !isAdmin; 
        document.getElementById('adminPanel').style.display = isAdmin ? 'block' : 'none';
        renderTabla(); 
    }

    // Inicialización
    renderTabla();
</script>
</body>
</html>
